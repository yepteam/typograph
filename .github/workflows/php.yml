name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring
        coverage: none
        tools: composer:v2

    - name: Validate composer.json
      run: composer validate --strict

    # composer.lock не хранится в репозитории (библиотека), поэтому кэшируется
    # не vendor, а загрузки Composer: зависимости каждый раз разрешаются заново
    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-composer-php${{ matrix.php }}-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    - name: Run test suite
      run: composer test
